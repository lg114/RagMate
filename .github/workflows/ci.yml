name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # 先装 CPU 版 torch，避免 pip 拉下带 CUDA 的大轮子（CI 机器没有 GPU）
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project and test dependencies
        working-directory: backend
        run: pip install -e ".[test]"
      - name: Run tests
        working-directory: backend
        # 配置模块在 import 时就校验必填项，CI 里给假值即可（单测 mock 了基础设施）
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ragmate
          LLM_API_KEY: test-key-for-ci
        run: pytest -q
