services:
  postgres:
    container_name: ragmate-postgres
    image: pgvector/pgvector:0.8.7-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: ragmate-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ragmate
      - DOCUMENTS_DIR=/app/documents
      - LLM_API_KEY=${LLM_API_KEY:-not-configured-yet}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}
      - RERANKER_API_BASE_URL=${RERANKER_API_BASE_URL:-https://api.jina.ai/v1/rerank}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ragmate_docs:/app/documents

volumes:
  postgres_data:
  ragmate_docs:
