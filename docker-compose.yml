services:
  # Postgres 15 + pgvector（sparsevec 需要扩展 >= 0.7）。
  # 文档、会话、入库状态和向量都在这一个库里。API 启动时 CREATE EXTENSION vector。
  # 从旧的 postgres:15 数据卷换过来时：docker compose up -d --force-recreate postgres
  postgres:
    container_name: ragmate-postgres
    image: pgvector/pgvector:0.8.7-pg15
    environment:
      POSTGRES_DB: ragmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragmate"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 可选。入库状态和会话都在 Postgres，默认不启动 Redis。
  # 只有多个 worker 要共享限流时才需要：docker compose --profile redis up -d
  # 并在 backend/.env 里设置 REDIS_URL=redis://localhost:6379/0
  redis:
    profiles: ["redis"]
    container_name: ragmate-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: ragmate-network
