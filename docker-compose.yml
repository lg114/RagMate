services:
  # Postgres 15 + pgvector（sparsevec 需要扩展 >= 0.7）。
  # 文档、会话、入库状态和向量都在这一个库里。API 启动时 CREATE EXTENSION vector。
  # 从旧的 postgres:15 数据卷换过来时：docker compose up -d --force-recreate postgres
  postgres:
    container_name: ragmate-postgres
    image: pgvector/pgvector:0.8.7-pg15
    environment:
      POSTGRES_DB: ragmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragmate"]
      interval: 10s
      timeout: 5s
      retries: 10

  ragmate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragmate-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ragmate
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./documents:/app/documents
    profiles: ["app", "all"]

networks:
  default:
    name: ragmate-network
