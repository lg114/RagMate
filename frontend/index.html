<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="RagMate: ask questions over your own documents, with cited answers.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>RagMate</title>
<style>
  :root {
    --bg: #171717; --bg-elev: #1e1e1e; --bg-nav: #0f0f0f; --bg-sunken: #262626;
    --ink: #ececec; --ink-soft: #a0a0a0; --muted: #6b6b6b;
    --line: #2a2a2a; --line-strong: #3a3a3a;
    --accent: #f0f0f0; --accent-ink: #0f0f0f; --accent-soft: #2a2a2a;
    --ok: #a0a0a0; --ok-soft: #262626;
    --shadow: none;
    --font: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; }
  code, .mono { font-family: var(--mono); font-size: .92em; }
  button { font: inherit; }

  .app { display: flex; height: 100dvh; }

  /* ---- 侧栏：历史对话 ---- */
  .sidebar {
    width: 260px; flex: none; display: flex; flex-direction: column;
    background: var(--bg-nav); border-right: 1px solid var(--line);
    transition: width 0.2s ease;
  }
  .sidebar.collapsed { width: 0; overflow: hidden; border-right: 0; }
  .sidebar-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px;
  }
  .sidebar-logo { flex: none; }
  .sidebar-brand {
    flex: 1; font-weight: 700; font-size: 15px; color: var(--ink);
    white-space: nowrap; overflow: hidden;
  }
  .sidebar-collapse {
    flex: none; border: 0; background: none; color: var(--ink-soft);
    cursor: pointer; padding: 4px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-collapse:hover { background: var(--bg-sunken); color: var(--ink); }
  .side-actions { padding: 10px 12px 6px; }
  .side-actions .side-new {
    width: 100%; padding: 9px 14px; text-align: left;
    background: var(--bg-elev); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .side-actions .side-new:hover { border-color: var(--accent); }
  .side-nav { padding: 4px 8px 0; display: flex; flex-direction: column; gap: 2px; }
  .side-nav button {
    border: 0; background: none; color: var(--ink-soft); cursor: pointer;
    padding: 8px 12px; border-radius: 8px; font-size: 14px; text-align: left;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-icon { flex: none; opacity: 0.7; }
  .side-nav button:hover { background: var(--bg-sunken); }
  .side-nav button.is-active { background: var(--bg-sunken); color: var(--ink); font-weight: 600; }
  .history-block[hidden] { display: none; }
  .history-block { padding: 0 8px; }
  .side-new {
    margin: 10px 12px 6px; padding: 9px 14px; text-align: left;
    background: var(--bg-elev); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .side-new:hover { border-color: var(--accent); }
  .side-label {
    padding: 10px 12px 6px; font-size: 14px; font-weight: 600; color: var(--muted);
    cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
  }
  .side-label:hover { color: var(--ink-soft); }
  .toggle-icon { transition: transform 0.2s; flex: none; transform: rotate(90deg); }
  .side-label.collapsed .toggle-icon { transform: rotate(0deg); }
  .pinned-block { padding: 0 8px; }
  .pinned-block[hidden] { display: none; }
  .pinned-toggle {
    padding: 6px 12px 6px 12px; font-size: 13px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pinned-toggle .toggle-icon { transform: rotate(90deg); }
  .pinned-toggle.collapsed .toggle-icon { transform: rotate(0deg); }
  .pinned-content {
    overflow: hidden; transition: max-height 0.2s ease;
  }
  .pinned-content.collapsed { max-height: 0 !important; }
  .history-content { overflow: hidden; transition: max-height 0.2s ease; }
  .history-content.collapsed { max-height: 0 !important; }
  .history-list { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  .history-list li {
    position: relative;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .history-list li:hover { background: var(--bg-sunken); }
  .history-list li.is-active { background: var(--bg-sunken); font-weight: 600; }
  .history-list .h-title {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .pin-icon { flex: none; color: var(--muted); }
  .history-list .h-more {
    flex: none; border: 0; background: none; color: var(--muted);
    cursor: pointer; padding: 4px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    visibility: hidden;
  }
  .history-list li:hover .h-more { visibility: visible; }
  .history-list .h-more:hover { background: var(--bg-sunken); color: var(--ink); }
  .h-menu {
    position: fixed; z-index: 100;
    background: #2a2a2a; border: 1px solid #3a3a3a;
    border-radius: 8px; padding: 4px; min-width: 180px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    display: none;
  }
  .h-menu.show { display: block; }
  .h-menu-item {
    width: 100%; border: 0; background: none; color: #d4d4d4;
    padding: 8px 12px; border-radius: 6px; font-size: 13px;
    cursor: pointer; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
  }
  .h-menu-item:hover { background: #3a3a3a; color: #fff; }
  .h-menu-item.danger { color: #ef4444; }
  .h-menu-item.danger:hover { background: #3a3a3a; color: #ef4444; }
  .h-menu-shortcut { color: #888; font-size: 12px; }
  .history-empty { padding: 4px 12px; color: var(--muted); font-size: 14px; }

  /* ---- 主栏：三视图（对话 / 文档 / 设置） ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .sidebar-expand {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    border: 1px solid var(--line-strong); background: var(--bg-elev);
    color: var(--ink-soft); border-radius: 8px; padding: 6px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
  }
  .sidebar-expand:hover { background: var(--bg-sunken); color: var(--ink); }
  .sidebar.collapsed ~ .main .sidebar-expand { display: flex; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }

  /* 空态：hero + 输入框收成一整块垂直居中；有消息后 hero 让位、输入框回到底部 */
  .welcome {
    display: none; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 18px;
  }
  .welcome-mark { width: 33px; height: 33px; flex: none; }
  .welcome-name { font-size: 28px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
  #view-chat.is-empty { justify-content: center; }
  #view-chat.is-empty .welcome { display: flex; }
  #view-chat.is-empty .scroll { display: none; }
  #view-chat.is-empty .composer { padding-bottom: 0; }

  .scroll { flex: 1; overflow-y: auto; }
  .scroll-inner { max-width: 760px; margin: 0 auto; padding: 28px 20px 40px; }

  .msg { margin-bottom: 22px; }
  .msg-user { display: flex; justify-content: flex-end; }
  .bubble-user {
    background: var(--bg-sunken); color: var(--ink);
    padding: 10px 14px; border-radius: var(--radius);
    border-bottom-right-radius: 4px; max-width: 85%; white-space: pre-wrap;
  }
  .bubble-ai { padding: 2px 0; }
  .bubble-ai p { margin: 0 0 10px; }
  .bubble-ai pre {
    background: var(--bg-sunken); border-radius: 8px; padding: 12px 14px;
    overflow-x: auto; font-size: 13.5px; margin: 0 0 10px;
  }
  .bubble-ai pre code { font-size: inherit; }
  .bubble-ai a { color: var(--accent); }
  .answer-status { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
  .cite {
    display: inline-grid; place-items: center;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--ink-soft);
    font-size: 12px; font-weight: 600; cursor: pointer; vertical-align: 2px;
  }
  .cite:hover { border-color: var(--accent); }

  .sources { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .sources h3 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .source-card {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .source-card.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
  .source-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .source-name { font-family: var(--mono); font-size: 13.5px; font-weight: 500; }
  .source-loc { font-size: 12.5px; color: var(--muted); }

  details.retrieval {
    margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg-elev); padding: 10px 14px;
  }
  details.retrieval summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .retrieval-meta { font-size: 13px; color: var(--muted); margin: 10px 0 8px; }
  .retrieval-chunks { list-style: none; margin: 0; padding: 0; }
  .retrieval-chunks li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .retrieval-chunks li:first-child { border-top: 0; }
  .retrieval-chunks .r-head { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .retrieval-chunks .r-head .mono { font-size: 12.5px; }
  .retrieval-chunks .r-preview { margin: 4px 0 0; color: var(--ink-soft); }
  .retrieval-dropped { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  .panel {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg-elev); padding: 16px 18px;
  }
  .panel h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .panel h2 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .doc-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .doc-list li {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px;
  }
  .doc-list li:first-child { border-top: 0; }
  .doc-list .mono { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-list .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .doc-list .doc-del {
    flex: none; border: 0; background: none; color: var(--muted);
    font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px;
  }
  .doc-list .doc-del:hover { color: var(--ink); }
  .doc-empty { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  .dropzone {
    margin-top: 14px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius);
    padding: 18px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .dropzone:hover { border-color: var(--accent); color: var(--accent); }
  .dropzone.busy { pointer-events: none; opacity: .6; }
  .settings-body { margin-top: 12px; }
  .settings-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .settings-row input {
    flex: 1; min-width: 200px; font-size: 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px;
  }
  .settings-row button {
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 8px; padding: 8px 16px;
  }
  .settings-note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .ready-list { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13.5px; }
  .ready-list li { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid var(--line); }
  .ready-list li:first-child { border-top: 0; }
  .ready-list .ok { color: var(--ink-soft); }
  .ready-list .bad { color: #b91c1c; }

  .composer {
    flex: none; background: var(--bg);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  /* 输入框是一个整体容器：上行文本域，下行工具条；描边只在聚焦时出现 */
  .composer-box {
    display: flex; flex-direction: column; gap: 2px;
    background: var(--bg-elev); border: 1px solid transparent;
    border-radius: 22px; padding: 8px 10px 8px 12px;
  }
  .composer-box:focus-within { border-color: var(--line-strong); }
  .composer textarea {
    width: 100%; resize: none; font-family: inherit;
    font-size: 15px; line-height: 1.5;
    background: none; color: var(--ink);
    border: 0; outline: 0; padding: 6px 4px;
    min-height: 27px; max-height: 160px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer-bar {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  }
  .composer-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .model-chip {
    font-size: 12px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .model-chip[hidden] { display: none; }
  .send-btn {
    flex: none; width: 30px; height: 30px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    display: grid; place-items: center;
  }
  .send-btn:hover { opacity: .9; }
  .send-btn:disabled { opacity: .32; cursor: default; }
  .send-btn:disabled:hover { opacity: .32; }

  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 13.5px;
    padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s; max-width: 90vw; text-align: center; z-index: 10;
  }
  .toast.show { opacity: 1; }
  .hint { color: var(--muted); font-size: 14px; }

  /* ---- Modal 弹窗 ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--bg-elev); border: 1px solid var(--line-strong);
    border-radius: var(--radius); padding: 24px;
    max-width: 400px; width: 90vw;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .modal-message {
    margin: 0 0 20px; font-size: 15px; color: var(--ink); line-height: 1.5;
  }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .modal-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--line-strong);
    background: var(--bg); color: var(--ink-soft);
  }
  .modal-btn:hover { background: var(--bg-sunken); }
  .modal-btn-confirm {
    background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent);
  }
  .modal-btn-confirm:hover { opacity: 0.9; }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
      transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.15);
    }
    .sidebar.open { transform: none; }
    .icon-btn { display: block; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg class="sidebar-logo" width="22" height="22" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" rx="18" fill="#fff" stroke="#111" stroke-width="4"/>
        <text x="50" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#111" text-anchor="middle" letter-spacing="-1">RM</text>
      </svg>
      <span class="sidebar-brand">RagMate</span>
      <button type="button" class="sidebar-collapse" id="sidebar-collapse" aria-label="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <nav class="side-nav" id="side-nav" aria-label="Views">
      <button type="button" data-view="chat">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        New Chat
      </button>
      <button type="button" data-view="documents">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Documents
      </button>
      <button type="button" data-view="settings">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </nav>
    <div class="pinned-block" id="pinned-block" hidden>
      <div class="side-label pinned-toggle" id="pinned-toggle">
        <span>Pinned</span>
        <svg class="toggle-icon" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="pinned-content" id="pinned-content">
        <ul class="history-list" id="pinned-list"></ul>
      </div>
    </div>
    <div class="history-block" id="history-block">
      <div class="side-label" id="chats-toggle">
        <span>Chats</span>
        <svg class="toggle-icon" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="history-content" id="history-content">
        <ul class="history-list" id="history-list"></ul>
        <p class="history-empty" id="history-empty">No conversations yet</p>
      </div>
    </div>
  </aside>

  <div class="main">
    <button type="button" class="sidebar-expand" id="sidebar-expand" aria-label="Expand sidebar">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="view" id="view-chat">
      <div class="welcome" id="welcome">
        <svg class="welcome-mark" viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="26" fill="#fff"/>
          <text x="50" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#111" text-anchor="middle" letter-spacing="-1">RM</text>
        </svg>
        <span class="welcome-name">RagMate</span>
      </div>

      <div class="scroll" id="scroll">
        <div class="scroll-inner">
          <div id="thread">
            <p class="hint" id="empty-hint" data-i18n="emptyHint">还没有提问。直接在下面输入。</p>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <div class="composer-box">
            <textarea id="input" rows="1" data-i18n-ph="placeholder" placeholder="基于已入库的文档提问" aria-label="Question"></textarea>
            <div class="composer-bar">
              <div class="composer-right">
                <span class="model-chip" id="model-chip" hidden></span>
                <button type="button" class="send-btn" id="send">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="view-documents" hidden>
      <div class="scroll">
        <div class="scroll-inner">
          <section class="panel" id="docs-box">
            <h2><span data-i18n="docsTitle">已入库的文档</span><span id="docs-count"></span></h2>
            <ul class="doc-list" id="doc-list"></ul>
            <p class="doc-empty" id="doc-empty" hidden data-i18n="docsEmpty">还没有入库的文档，先上传一份。</p>
            <div class="dropzone" id="dropzone" role="button" tabindex="0" data-i18n="dropzone">拖入文件或点这里上传新文档</div>
            <input type="file" id="file-input" hidden>
          </section>
        </div>
      </div>
    </div>

    <div class="view" id="view-settings" hidden>
      <div class="scroll">
        <div class="scroll-inner">
          <section class="panel">
            <h2 data-i18n="settingsTitle">设置</h2>
            <div class="settings-body">
              <div class="settings-row">
                <input type="password" id="token-input" data-i18n-ph="tokenPlaceholder" placeholder="API 令牌（默认空，不用填）" autocomplete="off">
                <button type="button" id="token-save" data-i18n="tokenSave">保存</button>
              </div>
              <p class="settings-note" data-i18n="tokenNote">令牌只保存在本浏览器，用于 API 鉴权；服务端默认不设鉴权，不用填。</p>
              <ul class="ready-list" id="ready-list"></ul>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <p class="modal-message" id="modal-message"></p>
    <div class="modal-actions">
      <button type="button" class="modal-btn modal-btn-cancel" id="modal-cancel">Cancel</button>
      <button type="button" class="modal-btn modal-btn-confirm" id="modal-confirm">Confirm</button>
    </div>
  </div>
</div>
<script src="/js/shell.js" defer></script>
</body>
</html>
