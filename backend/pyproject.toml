[project]
name = "ragmate"
version = "0.8.0"
description = "Self-hosted RAG application"
requires-python = ">=3.12"
dependencies = [
    # ── LangChain ecosystem ──
    # langchain-core 只给 LLM 客户端与文本切分用（Agent 已删，不再需要它之外的
    # langchain 包）。core 的下限 >=1.2.27 仍保留。
    "langchain-core>=1.2.27,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    # ── Web framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.6",
    # /ready 的 LLM 探活直接用它（openai 已间接依赖，但显式声明以免被上层改动带崩）
    "httpx>=0.27.0",
    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # ── Document parsing ──
    "pypdf>=4.0.0",
    "docx2txt>=0.8",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "striprtf>=0.0.26",
    "ebooklib>=0.18",
    # ── Configuration ──
    "pydantic-settings>=2.0.0",
    # ── CLI / progress ──
    # eval/cli.py 与 eval/retrieval_eval.py 在顶层 import tqdm，测试也经 backend.eval 导入它，
    # 因此必须是主依赖：只装 .[test] 的 CI 环境也需要它，不能只放在 eval extra 里。
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# 本地模型（opt-in）：默认走远程 embedding / rerank API，不加载 torch。
# 只有 EMBEDDING_PROVIDER=huggingface/local/flagembedding 或 RERANKER_PROVIDER=local
# 时才需要：pip install -e ".[local]"。这几个包只在函数内延迟 import。
local = [
    "torch>=2.0.0,<3.0.0",
    "sentence-transformers>=2.2.0",
    "FlagEmbedding>=0.1.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
ragmate-eval = "backend.eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "backend",
    "backend.api",
    "backend.application",
    "backend.application.ingest",
    "backend.core",
    "backend.domain",
    "backend.eval",
    "backend.infrastructure",
]

[tool.setuptools.package-dir]
backend = "."
